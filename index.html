<!DOCTYPE html>
<html>
<head>
  <title>Pickup Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #eee; }
    #map { height: 88vh; width: 100%; }
    #controls {
      padding: 10px 15px;
      background: #292929;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 10px;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    #tally {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .tally-section {
      padding: 5px;
      background: #333;
      border-radius: 5px;
    }
    .day-name { font-weight: bold; color: #ccc; }
    .skull {
      background-size: cover;
      width: 20px;
      height: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="controls">
    <input id="postcode" type="text" placeholder="Enter postcode and press Enter">
    <div id="tally">
      <div class="tally-section" id="yearly-tally">Yearly Count: 0</div>
      <div class="tally-section" id="daily-tally"></div>
    </div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([55.9533, -3.1883], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const iconUrls = {
      0: 'https://upload.wikimedia.org/wikipedia/commons/2/25/Skull_icon_gray.png',
      1: 'https://upload.wikimedia.org/wikipedia/commons/3/32/Skull_icon_red.png',
      2: 'https://upload.wikimedia.org/wikipedia/commons/4/49/Skull_icon_orange.png',
      3: 'https://upload.wikimedia.org/wikipedia/commons/f/f3/Skull_icon_yellow.png',
      4: 'https://upload.wikimedia.org/wikipedia/commons/1/1e/Skull_icon_green.png',
      5: 'https://upload.wikimedia.org/wikipedia/commons/7/7f/Skull_icon_blue.png',
      6: 'https://upload.wikimedia.org/wikipedia/commons/a/a3/Skull_icon_purple.png'
    };

    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

    let tally = JSON.parse(localStorage.getItem("pickupTally")) || {};
    let markers = JSON.parse(localStorage.getItem("pickupMarkers")) || [];
    let yearlyCount = parseInt(localStorage.getItem("yearlyCount")) || 0;

    function updateTallyDisplay() {
      const yearlyDiv = document.getElementById("yearly-tally");
      yearlyDiv.innerText = `Yearly Count: ${yearlyCount}`;

      const dailyDiv = document.getElementById("daily-tally");
      dailyDiv.innerHTML = Object.keys(tally).map(day => 
        `<div><span class="day-name">${day}</span>: ${tally[day]}</div>`
      ).join("");
    }

    function saveData() {
      localStorage.setItem("pickupTally", JSON.stringify(tally));
      localStorage.setItem("pickupMarkers", JSON.stringify(markers));
      localStorage.setItem("yearlyCount", yearlyCount.toString());
    }

    function addMarker(postcode) {
      if (!postcode) return;

      const dayIndex = new Date().getDay();
      const dayName = dayNames[dayIndex];
      const iconUrl = iconUrls[dayIndex];

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${postcode}, Edinburgh`)
        .then(res => res.json())
        .then(data => {
          if (data.length === 0) {
            alert("Postcode not found");
            return;
          }

          const lat = data[0].lat;
          const lon = data[0].lon;
          const skullIcon = L.icon({
            iconUrl: iconUrl,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          L.marker([lat, lon], { icon: skullIcon }).addTo(map);

          markers.push({ lat, lon, dayIndex });
          tally[dayName] = (tally[dayName] || 0) + 1;
          yearlyCount++;

          saveData();
          updateTallyDisplay();
        });
    }

    document.getElementById("postcode").addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        const postcode = this.value.trim();
        addMarker(postcode);
        this.value = '';
      }
    });

    markers.forEach(m => {
      const skullIcon = L.icon({
        iconUrl: iconUrls[m.dayIndex],
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
      L.marker([m.lat, m.lon], { icon: skullIcon }).addTo(map);
    });

    updateTallyDisplay();
  </script>
</body>
</html>
